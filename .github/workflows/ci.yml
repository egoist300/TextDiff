name: CI

# 利用者と同じ Windows PowerShell 5.1 で実行するため、shell: pwsh（PowerShell 7）ではなく shell: powershell を使う。
#
# run: の中に日本語を書かない。runner は run: の内容を BOM なしの UTF-8 で一時 .ps1 に書き出し、
# Windows PowerShell 5.1 はそれを ANSI コードページとして読むため、文字化けし、構文エラーになることもある。
#
# モジュールのバージョンは、範囲で指定すると runner にインストール済みの別のバージョンが選ばれるため、
# -RequiredVersion で 1 つのバージョンに固定する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # runner の shell: powershell の実体が変更されたときに検出するため。
      - name: Check PowerShell version
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1 but got $($PSVersionTable.PSVersion)" }

      # windows-latest に同梱されているバージョンなら、何もしない。バージョンが異なればインストールし、ログに記録される。
      # Windows 同梱の Pester 3.4.0 と署名者が異なるため、-SkipPublisherCheck が必要。
      - name: Ensure Pester
        shell: powershell
        run: |
          $want = [version]'5.9.0'
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object -FilterScript { $_.Version -eq $want })) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion $want
          }

      # tests/CodingRules.Tests.ps1 が、カスタムルールを実行して確認するため。
      - name: Ensure PSScriptAnalyzer
        shell: powershell
        run: |
          $want = [version]'1.25.0'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object -FilterScript { $_.Version -eq $want })) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion $want
          }

      - name: Pester
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Import-Module -Name Pester -RequiredVersion 5.9.0 -Force
          $result = Invoke-Pester -Path .\tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed" }

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PSScriptAnalyzer
        shell: powershell
        run: |
          $want = [version]'1.25.0'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object -FilterScript { $_.Version -eq $want })) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion $want
          }

      # 設定ファイルで Severity を指定していないため、構文エラー（ParseError）のあるファイルもここで失敗する。
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1)
          if ($findings.Count -gt 0) {
              $findings | Format-Table -Property RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
              throw "$($findings.Count) finding(s) from PSScriptAnalyzer"
          }

  # 公開と同じ手順で、runner の中のフォルダへ試験的に公開する。
  # PowerShell Gallery への公開時に、初めてマニフェストやパッケージの不備が判明するのを防ぐため。
  # 手順は publish.yml と同じにする。
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PSResourceGet
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -RequiredVersion 1.2.0

      - name: Publish to a local repository
        shell: powershell
        run: |
          Import-Module -Name Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0 -Force
          $localRepository = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'local-repository'
          New-Item -ItemType Directory -Path $localRepository -Force | Out-Null
          Register-PSResourceRepository -Name LocalCheck -Uri $localRepository -Trusted
          Publish-PSResource -Path .\TextDiff -Repository LocalCheck
          $package = @(Get-ChildItem -LiteralPath $localRepository -Filter 'TextDiff.*.nupkg')
          if ($package.Count -ne 1) { throw "Expected one TextDiff package but found $($package.Count)" }
          Write-Host -Object "Packaged: $($package[0].Name)"
