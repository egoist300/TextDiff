name: Publish

# run: の中に日本語を書かない。runner は run: の内容を BOM なしの UTF-8 で一時 .ps1 に書き出し、
# Windows PowerShell 5.1 はそれを ANSI コードページとして読むため、文字化けし、構文エラーになることもある。

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Pester
        shell: powershell
        run: |
          $want = [version]'5.9.0'
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object -FilterScript { $_.Version -eq $want })) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion $want
          }

      # tests/CodingRules.Tests.ps1 が、カスタムルールを実行して確認するため。
      - name: Ensure PSScriptAnalyzer
        shell: powershell
        run: |
          $want = [version]'1.25.0'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object -FilterScript { $_.Version -eq $want })) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion $want
          }

      - name: Pester
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Import-Module -Name Pester -RequiredVersion 5.9.0 -Force
          $result = Invoke-Pester -Path .\tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed" }

  publish:
    needs: test
    runs-on: windows-latest
    # 公開には Secrets を使うため、承認の手順を追加する場合は environment を設定する。
    steps:
      - uses: actions/checkout@v7

      # タグとマニフェストのバージョンが異なるまま公開すると、公開したバージョンから元のコミットを特定できなくなるため。
      - name: Check tag matches ModuleVersion
        shell: powershell
        run: |
          $version = (Import-PowerShellDataFile -Path .\TextDiff\TextDiff.psd1).ModuleVersion
          if ('v' + $version -cne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match ModuleVersion $version" }

      - name: Ensure PSResourceGet
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -RequiredVersion 1.2.0

      - name: Publish to PowerShell Gallery
        shell: powershell
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:PSGALLERY_API_KEY)) { throw 'PSGALLERY_API_KEY is not set' }
          Import-Module -Name Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0 -Force
          Publish-PSResource -Path .\TextDiff -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
